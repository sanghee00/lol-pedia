spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  cache:
    type: none
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
logging:
  level:
    org.springframework: info
